name: Windows build

# Flutter cannot cross-compile Windows from macOS or Linux, so the .exe is built
# on a GitHub-hosted Windows machine. Free for public repositories; private ones
# draw on the monthly Actions allowance, and Windows minutes count double.
on:
  push:
    branches: [main]
    # A v-prefixed tag publishes a release. The app's own updater reads that
    # release, so the tag is what actually ships to the gym.
    tags: ['v*']
  pull_request:
    branches: [main]
  # Lets you build a .exe on demand from the Actions tab without pushing.
  workflow_dispatch:

# Read-only by default. Only the release job, which runs nothing but `gh`
# against files built here, is given write access — so a compromised action,
# Flutter download or Chocolatey package in the build cannot use the token to
# publish a release of its own (audit SEC-003).
permissions:
  contents: read

defaults:
  run:
    working-directory: rmf_desktop

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA, not a tag: a tag
      # can be moved to different code at any time by whoever controls that
      # repository, and these steps run with this workflow's token. To
      # update, resolve the new tag with
      #   gh api repos/<owner>/<repo>/git/ref/tags/<tag>
      # (dereferencing an annotated tag to its commit) and keep the comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Matches .fvmrc so CI and the developer machine agree.
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # Includes the migration tests, which prove an installed copy can be
      # upgraded without losing the gym's members and payments.
      - run: flutter test

  build-windows:
    name: Build Windows .exe
    needs: test
    runs-on: windows-latest
    # Handed to the release job, which has no checkout to read pubspec from.
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      # "Send to developer" posts to an Apps Script whose address is kept out
      # of this public repository. A release without it would ship a button
      # that can only say it cannot send, so a tag refuses to build without it;
      # ordinary pushes and pull requests build either way.
      - name: Check the diagnostics upload address is set
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIAGNOSTICS_UPLOAD_URL: ${{ secrets.DIAGNOSTICS_UPLOAD_URL }}
        run: |
          if (-not $env:DIAGNOSTICS_UPLOAD_URL) {
            throw "The DIAGNOSTICS_UPLOAD_URL secret is not set. " +
                  "See docs/diagnostics/SETUP.md."
          }
        shell: pwsh

      # Downloads SQLite for Windows and pdfium (used to turn the receipt PDF
      # into the PNG sent over WhatsApp), so the build needs network access.
      # The upload address goes in through the environment rather than being
      # written into the command, so it never appears in the workflow source.
      - name: Build release
        env:
          DIAGNOSTICS_UPLOAD_URL: ${{ secrets.DIAGNOSTICS_UPLOAD_URL }}
        run: >-
          flutter build windows --release
          "--dart-define=DIAGNOSTICS_UPLOAD_URL=$env:DIAGNOSTICS_UPLOAD_URL"
        shell: pwsh

      - name: Show what was produced
        run: |
          Get-ChildItem -Recurse build\windows\x64\runner\Release |
            Select-Object Name, Length
        shell: pwsh

      # Fail loudly rather than publishing an archive missing its native
      # libraries, which would crash on first launch on the owner's machine.
      - name: Check the native libraries shipped
        run: |
          $dir = "build\windows\x64\runner\Release"
          # Named after BINARY_NAME in windows/CMakeLists.txt, not the display
          # name the installer shows on shortcuts.
          $exe = Join-Path $dir "rich_man_fitness.exe"
          if (-not (Test-Path $exe)) { throw "Executable missing: $exe" }
          $sqlite = Get-ChildItem $dir -Filter "sqlite3*.dll" -Recurse
          if (-not $sqlite) { throw "sqlite3 DLL missing - the app cannot open its database" }
          $pdfium = Get-ChildItem $dir -Filter "pdfium*.dll" -Recurse
          if (-not $pdfium) { throw "pdfium DLL missing - receipts cannot be rendered" }
          Write-Host "Executable, SQLite and pdfium are all present."
        shell: pwsh

      - name: Upload the app folder
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RichManFitness-windows-portable
          path: rmf_desktop/build/windows/x64/runner/Release/
          # The whole folder is required: the .exe will not start without the
          # DLLs beside it.
          if-no-files-found: error
          retention-days: 30

      # --- Installer -------------------------------------------------------
      # Turns that folder into one setup .exe the gym owner can double-click.
      - name: Read the app version
        id: version
        run: |
          $line = Select-String -Path rmf_desktop\pubspec.yaml -Pattern '^version:\s*(.+)$'
          $version = $line.Matches[0].Groups[1].Value.Split('+')[0].Trim()
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "App version: $version"
        shell: pwsh
        working-directory: .

      # The app looks for RichManFitness-Setup-<pubspec version>.exe inside the
      # release for tag v<version>. If the two disagree it would find nothing
      # and silently never update, so this fails the build instead.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $app = "${{ steps.version.outputs.value }}"
          if ($tag -ne $app) {
            throw "Tag v$tag does not match pubspec version $app. " +
                  "The updater would look for an installer that is not there."
          }
          Write-Host "Tag and app version agree: $app"
        shell: pwsh
        working-directory: .

      # Pinned, so the compiler that builds the installer changes only when
      # this line does. 6.7.1 is what the runner image already carried for the
      # v2.2.0 and v2.3.0 releases (choco reported it "already installed"),
      # and the newest approved Chocolatey package as of October 2026.
      # --allow-downgrade so a newer copy preinstalled on a future image is
      # replaced rather than silently used; the check below proves it was.
      - name: Install Inno Setup
        run: >-
          choco install innosetup --version=6.7.1 --allow-downgrade
          --no-progress -y
        shell: pwsh
        working-directory: .

      - name: Check the Inno Setup version
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe missing: $iscc" }
          # The numeric version fields, not the display strings, whose
          # format is up to whoever built the binary.
          $info = (Get-Item $iscc).VersionInfo
          $version = "$($info.FileMajorPart).$($info.FileMinorPart).$($info.FileBuildPart)"
          Write-Host "Inno Setup compiler: $version ($($info.ProductVersion))"
          if ($version -ne "6.7.1") {
            throw "Expected Inno Setup 6.7.1, found $version. " +
                  "Update the pin in this workflow deliberately, or fix it."
          }
        shell: pwsh
        working-directory: .

      - name: Build the installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.value }}" `
            "/DSourceDir=..\rmf_desktop\build\windows\x64\runner\Release" `
            installer\rich_man_fitness.iss
        shell: pwsh
        working-directory: .

      - name: Upload the installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RichManFitness-Setup
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 90

  # --- Release -----------------------------------------------------------
  # Its own job so that it alone holds write access. It checks out nothing
  # and runs no third-party code beyond downloading the installer the build
  # job uploaded; the tag-against-pubspec and upload-address checks have
  # already passed there, or this job never starts.
  release:
    name: Publish the release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        # No checkout here, so the workflow's rmf_desktop default does not
        # exist.
        working-directory: .
    steps:
      - name: Download the installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: RichManFitness-Setup
          path: dist

      # The checksum is computed from the very installer being uploaded, in
      # the job that uploads it: the app refuses to run a download that does
      # not match it, so a hand-typed digest would lock every gym PC out of
      # updating.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # gh normally reads the repository from a checkout; there is none.
          GH_REPO: ${{ github.repository }}
        run: |
          $version = "${{ needs.build-windows.outputs.version }}"
          $installer = "dist\RichManFitness-Setup-$version.exe"
          if (-not (Test-Path $installer)) { throw "Installer missing: $installer" }

          $digest = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          $checksum = "$installer.sha256"
          "$digest  RichManFitness-Setup-$version.exe" |
            Out-File -FilePath $checksum -Encoding ascii -NoNewline
          Write-Host "SHA-256: $digest"

          gh release create "${{ github.ref_name }}" `
            "$installer" "$checksum" `
            --title "Rich Man Fitness $version" `
            --generate-notes
        shell: pwsh
